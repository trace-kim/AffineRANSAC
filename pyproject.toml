[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "affine-ransac"
version = "0.0.1"
description = "Photomask registration error: OASIS design vs. stitched SEM images"
requires-python = ">=3.11"
dependencies = [
    "klayout",
    "opencv-python-headless",
    "numpy",
    "pyqtgraph",
    "PySide6",
    "scikit-image",
    "scipy",
]

[project.optional-dependencies]
# Everything for development: tests and VS Code notebooks.
# Install with:  pip install -e ".[dev]"
dev = ["pytest", "ipykernel", "pandas", "matplotlib", "ipympl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
