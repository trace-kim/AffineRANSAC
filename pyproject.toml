[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "affine-ransac"
dynamic = ["version"]  # affine_ransac.__version__
description = "Photomask registration error: OASIS design vs. stitched SEM images"
requires-python = ">=3.11"
dependencies = [
    "klayout",
    "opencv-python-headless",
    "numpy",
    "pyqtgraph",
    "PySide6",
    "scikit-image",
    "scipy",
]

[project.scripts]
# The release app for users (docs/SPEC.md D77).
maskreg = "affine_ransac.release.app:main"

[project.optional-dependencies]
# Everything for development: tests and VS Code notebooks.
# Install with:  pip install -e ".[dev]"
dev = ["pytest", "ipykernel", "pandas", "matplotlib", "ipympl", "pyftpdlib", "pyinstaller"]

[tool.setuptools.dynamic]
version = {attr = "affine_ransac.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
